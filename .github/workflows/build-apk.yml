name: Build BUILDTRACK APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract BUILDTRACK project
        run: |
          unzip BUILDTRACK_CrossPlatform_Project.zip -d extracted
          ls -la extracted/buildtrack_android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        run: |
          cd extracted/buildtrack_android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BUILDTRACK-APK
          path: extracted/buildtrack_android/app/build/outputs/apk/debug/app-debug.apk
